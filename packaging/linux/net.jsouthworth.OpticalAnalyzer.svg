<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="odLens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="osLens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Rounded app badge -->
  <rect x="6" y="6" width="116" height="116" rx="24" fill="url(#bg)"/>
  <rect x="6.75" y="6.75" width="114.5" height="114.5" rx="23.25" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Subtle optical grid -->
  <g stroke="#334155" stroke-width="0.75" opacity="0.55">
    <line x1="64" y1="18" x2="64" y2="110"/>
    <line x1="16" y1="54" x2="112" y2="54"/>
  </g>

  <!-- Bridge -->
  <path d="M 56 48.5 Q 64 43 72 48.5" fill="none" stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="butt"/>

  <!-- OD (left in front view) lens contour -->
  <rect x="17" y="34" width="39" height="36" rx="13" fill="url(#odLens)" stroke="#34d399" stroke-width="3"/>
  <!-- OS (right in front view) lens contour -->
  <rect x="72" y="34" width="39" height="36" rx="13" fill="url(#osLens)" stroke="#60a5fa" stroke-width="3"/>

  <!-- Optical center crosshairs (nasally decentered) -->
  <g stroke="#f87171" stroke-width="2" stroke-linecap="round">
    <circle cx="40" cy="52" r="3.2" fill="none"/>
    <line x1="34.5" y1="52" x2="45.5" y2="52"/>
    <line x1="40" y1="46.5" x2="40" y2="57.5"/>

    <circle cx="88" cy="52" r="3.2" fill="none"/>
    <line x1="82.5" y1="52" x2="93.5" y2="52"/>
    <line x1="88" y1="46.5" x2="88" y2="57.5"/>
  </g>

  <!-- Meniscus lens cross-section arc below frames -->
  <path d="M 24 83 Q 64 105 104 83 L 104 93 Q 64 107 24 93 Z" fill="url(#spectrum)" fill-opacity="0.24" stroke="url(#spectrum)" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="64" y1="93" x2="64" y2="101" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
</svg>
